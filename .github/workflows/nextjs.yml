name: Deploy Pages and Docker

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Static English edition for GitHub Pages.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Automatically inject basePath in your Next.js configuration file and disable
          # server side image optimization (https://nextjs.org/docs/api-reference/next/image#unoptimized).
          #
          # You may remove this line if you want to manage the configuration yourself.
          static_site_generator: next
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build
        env:
          BUILD_OUTPUT_MODE: export
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Internationalized Next.js server edition for Docker.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            learnmark/website:latest
            learnmark/website:${{ github.sha }}
          cache-from: type=gha,scope=learnmark-website
          cache-to: type=gha,mode=max,scope=learnmark-website
          provenance: false

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  server-deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Deploy Docker image to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEMO_SERVER_IP }}
          port: ${{ secrets.DEMO_SERVER_PORT }}
          username: ${{ secrets.DEMO_SERVER_USERNAME }}
          password: ${{ secrets.DEMO_SERVER_PASSWORD }}
          script: |
            set -eu

            image="learnmark/website:${{ github.sha }}"
            container="learnmark"
            rollback_container="learnmark-rollback"

            rollback() {
              docker logs --tail 100 "$container" || true
              docker rm -f "$container" || true

              if docker container inspect "$rollback_container" >/dev/null 2>&1; then
                docker rename "$rollback_container" "$container"
                docker start "$container"
              fi

              exit 1
            }

            docker pull "$image"
            docker rm -f "$rollback_container" >/dev/null 2>&1 || true

            if docker container inspect "$container" >/dev/null 2>&1; then
              docker stop "$container"
              docker rename "$container" "$rollback_container"
            fi

            if ! docker run -d \
              --name "$container" \
              --restart unless-stopped \
              -p 90:3000 \
              -v learnmark-data:/app/data \
              "$image"; then
              rollback
            fi

            healthy="false"
            for attempt in $(seq 1 30); do
              status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")

              if [ "$status" = "healthy" ]; then
                healthy="true"
                break
              fi

              if [ "$status" = "unhealthy" ] || [ "$status" = "exited" ]; then
                break
              fi

              sleep 2
            done

            if [ "$healthy" != "true" ]; then
              rollback
            fi

            docker rm -f "$rollback_container" >/dev/null 2>&1 || true
            docker image prune -f
